name: Release (Proto Test)

# This workflow is for testing OIDC publishing with proto toolchain manager
# It's manually triggered to avoid conflicts with the main release workflow
# Use this to verify proto + OIDC compatibility

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      test_mode:
        description: 'Run in test mode (dry-run only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC trusted publishing

jobs:
  release:
    name: Release with Proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup proto toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: proto run npm -- install

      - name: Build
        run: proto run npm -- run build

      - name: Verify npm version
        run: |
          echo "npm version: $(proto run npm -- --version)"
          echo "node version: $(proto run node -- --version)"
          echo "Expected: npm 11.6.2+ for OIDC support"

      - name: Create Release Pull Request or Publish
        uses: garthdb/changesets-action@v1.6.8
        with:
          # Use 'npm exec' instead of 'npx' to ensure proto's npm (11.6.2) is used, not Node's bundled npm
          # CRITICAL: Use 'npm exec' NOT 'npx' - npx uses Node's bundled npm (10.x) which lacks OIDC support
          publish: proto run npm -- exec changeset publish
          oidcAuth: true  # Enable OIDC authentication
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN not needed with OIDC trusted publishing
