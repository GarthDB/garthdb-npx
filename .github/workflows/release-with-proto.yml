name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC trusted publishing

jobs:
  release:
    name: Release with Proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup proto toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: proto run npm -- install

      - name: Build
        run: proto run npm -- run build

      - name: Debug OIDC Environment Variables
        run: |
          echo "=== OIDC Environment Variables ==="
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-NOT SET}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "YES" || echo "NO")"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN length: ${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          echo ""
          echo "=== npm Configuration ==="
          echo "npm version: $(proto run npm -- --version)"
          echo "npm path (via proto run): $(which npm || echo 'N/A')"
          echo ""
          echo "=== Environment Variables (filtered) ==="
          env | grep -i "ACTIONS\|NPM\|NODE" | sort || true

      - name: Debug npm publish (dry-run)
        run: |
          echo "=== Testing npm publish with dry-run (via proto run) ==="
          proto run npm -- publish --dry-run 2>&1 || echo "Exit code: $?"
        continue-on-error: true

      - name: Debug npm whoami (check auth status)
        run: |
          echo "=== Checking npm authentication status (via proto run) ==="
          proto run npm -- whoami 2>&1 || echo "Not authenticated (exit code: $?)"
        continue-on-error: true

      - name: Create Release Pull Request or Publish
        uses: garthdb/changesets-action@v1.6.8
        with:
          publish: proto run npm -- run release
          oidcAuth: true  # Enable OIDC authentication
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN not needed with OIDC trusted publishing
