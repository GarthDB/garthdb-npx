name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC trusted publishing

jobs:
  release:
    name: Release without Proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11.6.2
        # npm 11.5.1+ required for OIDC support
        # setup-node doesn't support npm-version input, so we install separately
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Debug OIDC Environment Variables
        run: |
          echo "=== OIDC Environment Variables ==="
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-NOT SET}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "YES" || echo "NO")"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN length: ${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          echo ""
          echo "=== npm Configuration ==="
          echo "npm version: $(npm --version)"
          echo "npm path: $(which npm)"
          echo ""
          echo "=== Environment Variables (filtered) ==="
          env | grep -i "ACTIONS\|NPM\|NODE" | sort || true

      - name: Debug npm publish (dry-run)
        run: |
          echo "=== Testing npm publish with dry-run (without proto) ==="
          npm publish --dry-run 2>&1 || echo "Exit code: $?"
        continue-on-error: true

      - name: Debug npm whoami (check auth status)
        run: |
          echo "=== Checking npm authentication status (without proto) ==="
          npm whoami 2>&1 || echo "Not authenticated (exit code: $?)"
        continue-on-error: true

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN not needed with OIDC trusted publishing
